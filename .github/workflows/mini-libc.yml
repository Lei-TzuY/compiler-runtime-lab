name: mini-libc

on:
  push:
    branches: [main]
    paths:
      - 'projects/tiny-c-compiler/**'
      - 'projects/mini-libc/**'
      - 'projects/mini-elf-toolchain/**'
      - '.github/workflows/mini-libc.yml'
  pull_request:
    paths:
      - 'projects/tiny-c-compiler/**'
      - 'projects/mini-libc/**'
      - 'projects/mini-elf-toolchain/**'
      - '.github/workflows/mini-libc.yml'

permissions:
  contents: read

concurrency:
  group: mini-libc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: projects/mini-libc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run probes
        run: make clean test CC=${{ matrix.cc }}

      - name: Verify host-libc independence
        run: make inspect CC=${{ matrix.cc }}

  imported-tiny-c-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella
        uses: actions/checkout@v4

      - name: Build imported tiny-c-compiler
        shell: bash
        run: |
          set -euo pipefail
          make -C projects/tiny-c-compiler minicc
          test -x projects/tiny-c-compiler/minicc

      - name: Compile and run mini-libc through imported tiny-c-compiler
        shell: bash
        working-directory: projects/mini-libc
        run: |
          set -euo pipefail
          MINICC="$GITHUB_WORKSPACE/projects/tiny-c-compiler/minicc" \
            ./tests/verify-tiny-c-compiler.sh

  umbrella-mini-toolchain-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella
        uses: actions/checkout@v4

      - name: Build imported tiny-c-compiler
        shell: bash
        run: |
          set -euo pipefail
          make -C projects/tiny-c-compiler minicc
          test -x projects/tiny-c-compiler/minicc

      - name: Build imported mini-elf-toolchain
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mini-elf-target"
          cargo build \
            --manifest-path projects/mini-elf-toolchain/Cargo.toml \
            --bin mini-elf-toolchain

      - name: Compile, link, run, and inspect the umbrella bootstrap
        shell: bash
        working-directory: projects/mini-libc
        run: |
          set -euo pipefail
          MINICC="$GITHUB_WORKSPACE/projects/tiny-c-compiler/minicc" \
          MINI_ELF_LINKER="$RUNNER_TEMP/mini-elf-target/debug/mini-elf-toolchain" \
          OUT=build/umbrella-mini-toolchain-integration \
            ./tests/verify-tiny-c-compiler.sh
