name: mini-language-server

on:
  push:
    branches: [main]
    paths:
      - "projects/mini-language-server/**"
      - ".github/workflows/mini-language-server.yml"
  pull_request:
    paths:
      - "projects/mini-language-server/**"
      - ".github/workflows/mini-language-server.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/mini-language-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/mini-language-server/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
