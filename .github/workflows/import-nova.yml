name: import-nova

on:
  push:
    branches: [chore/import-nova]
    paths:
      - '.github/workflows/import-nova.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: Lei-TzuY/Nova
      SOURCE_SHA: dcadc2238737b6f1e98887ab8fa658b23413d31b
      EXPECTED_UMBRELLA_MAIN: 0f03846785e863e6e9cfd55626c0b8500bda415d
      TARGET_PATH: projects/Nova
      SOURCE_REMOTE: source-nova
    steps:
      - name: Checkout full umbrella history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify frozen umbrella and source state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'chore/import-nova'
          test -z "$(git status --porcelain)"
          test ! -e "$TARGET_PATH"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"
          git remote add "$SOURCE_REMOTE" "https://github.com/$SOURCE_REPO.git"
          git fetch "$SOURCE_REMOTE" main --tags --prune
          test "$(git rev-parse "$SOURCE_REMOTE/main")" = "$SOURCE_SHA"

      - name: Audit complete reachable source history
        shell: bash
        run: |
          set -euo pipefail
          git log "$SOURCE_REMOTE/main" --format='%H%x09%an%x09%ae%x09%B' > /tmp/source-history.txt
          if grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai' /tmp/source-history.txt > /tmp/attribution-matches.txt; then
            echo 'Attribution/history matches detected; refusing automatic import.'
            cat /tmp/attribution-matches.txt
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA:Cargo.toml"
          git cat-file -e "$SOURCE_SHA:Cargo.lock"
          git cat-file -e "$SOURCE_SHA:README.md"
          git cat-file -e "$SOURCE_SHA:rust-toolchain.toml"
          git cat-file -e "$SOURCE_SHA:crates"
          git cat-file -e "$SOURCE_SHA:docs"

      - name: Import subtree without squashing history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git subtree add --prefix="$TARGET_PATH" "$SOURCE_REMOTE" main
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Verify subtree blob-for-blob
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree -r "$SOURCE_SHA" | sort > /tmp/source-tree.txt
          git ls-tree -r HEAD -- "$TARGET_PATH" | sed "s#\t$TARGET_PATH/#\t#" | sort > /tmp/imported-tree.txt
          diff -u /tmp/source-tree.txt /tmp/imported-tree.txt

      - name: Install stable and MSRV Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Run source-equivalent stable gates
        shell: bash
        working-directory: projects/Nova
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nova-stable-target
        run: |
          set -euo pipefail
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo +stable test --workspace --all-targets --locked
          cargo +stable build --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --workspace --no-deps --locked

      - name: Run Rust 1.85 MSRV gate
        shell: bash
        working-directory: projects/Nova
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nova-msrv-target
        run: |
          set -euo pipefail
          cargo +1.85.0 check --workspace --all-targets --locked

      - name: Verify tracked tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Remove one-shot workflow and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/import-nova.yml
          git commit -m 'chore: remove one-shot Nova import workflow'
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          if git log -2 --format='%B' | grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai'; then
            echo 'Forbidden attribution trailer in umbrella migration commits.'
            exit 1
          fi
          git fetch "$SOURCE_REMOTE" main --prune
          test "$(git rev-parse "$SOURCE_REMOTE/main")" = "$SOURCE_SHA"
          git fetch origin main "$GITHUB_REF_NAME" --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git push origin HEAD:"$GITHUB_REF_NAME"
