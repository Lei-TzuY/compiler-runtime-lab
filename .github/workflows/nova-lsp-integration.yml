name: nova-lsp-integration

on:
  push:
    branches: [main]
    paths:
      - "projects/Nova/**"
      - "projects/mini-language-server/**"
      - "integration/nova-lsp/**"
      - ".github/workflows/nova-lsp-integration.yml"
  pull_request:
    paths:
      - "projects/Nova/**"
      - "projects/mini-language-server/**"
      - "integration/nova-lsp/**"
      - ".github/workflows/nova-lsp-integration.yml"

permissions:
  contents: read

jobs:
  shared-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/mini-language-server/pyproject.toml

      - name: Install mini-language-server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e projects/mini-language-server

      - name: Verify shared fixtures through mini-language-server
        run: python integration/nova-lsp/check_lsp.py

      - name: Verify legal shared fixture through Nova
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/nova-lsp-target"
          cargo run --quiet \
            --manifest-path projects/Nova/Cargo.toml \
            -p nova-cli -- \
            check integration/nova-lsp/valid.nv

      - name: Verify unresolved-name agreement
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/nova-lsp-target"
          set +e
          cargo run --quiet \
            --manifest-path projects/Nova/Cargo.toml \
            -p nova-cli -- \
            check integration/nova-lsp/unresolved.nv --message-format=json \
            >"$RUNNER_TEMP/nova-unresolved.stdout" \
            2>"$RUNNER_TEMP/nova-unresolved.stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$RUNNER_TEMP/nova-unresolved.stdout"
          grep -F '"code":"N3003"' "$RUNNER_TEMP/nova-unresolved.stderr"
