name: tiny-tensor-compiler

on:
  push:
    branches: [main]
    paths:
      - 'projects/tiny-tensor-compiler/**'
      - '.github/workflows/tiny-tensor-compiler.yml'
  pull_request:
    paths:
      - 'projects/tiny-tensor-compiler/**'
      - '.github/workflows/tiny-tensor-compiler.yml'

permissions:
  contents: read

concurrency:
  group: tiny-tensor-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/tiny-tensor-compiler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
