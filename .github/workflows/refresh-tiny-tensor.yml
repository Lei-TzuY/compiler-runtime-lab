name: refresh-tiny-tensor

on:
  push:
    branches: [chore/import-tiny-tensor-compiler]
    paths:
      - '.github/workflows/refresh-tiny-tensor.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: Lei-TzuY/tiny-tensor-compiler
      OLD_SOURCE_SHA: 66ff2c6d02a22c621d01579b442af8b6fd43bcc5
      SOURCE_SHA: 4690df5747a1e7fc0af9b602f8be8d963e72d00f
      EXPECTED_UMBRELLA_MAIN: cef15ded5ffe78bba7fdd8ffe9d4f2d43b6e576a
      TARGET_PATH: projects/tiny-tensor-compiler
    steps:
      - name: Checkout full umbrella history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen umbrella and source state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'chore/import-tiny-tensor-compiler'
          test -z "$(git status --porcelain)"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"
          git remote add source "https://github.com/$SOURCE_REPO.git"
          git fetch source main --tags --prune
          test "$(git rev-parse source/main)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$OLD_SOURCE_SHA" HEAD

      - name: Audit newly reachable source commits for forbidden attribution
        shell: bash
        run: |
          set -euo pipefail
          git log "$OLD_SOURCE_SHA..$SOURCE_SHA" --format='%H%x09%an%x09%ae%x09%B' > /tmp/new-source-history.txt
          if grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai' /tmp/new-source-history.txt > /tmp/attribution-matches.txt; then
            echo 'Forbidden attribution/history matches in newly reachable source commits.'
            cat /tmp/attribution-matches.txt
            exit 1
          fi

      - name: Refresh subtree without squashing source history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git subtree pull --prefix="$TARGET_PATH" source main -m 'chore: refresh tiny-tensor-compiler source snapshot'
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Verify subtree blob-for-blob
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree -r "$SOURCE_SHA" | sort > /tmp/source-tree.txt
          git ls-tree -r HEAD -- "$TARGET_PATH" | sed "s#\t$TARGET_PATH/#\t#" | sort > /tmp/imported-tree.txt
          diff -u /tmp/source-tree.txt /tmp/imported-tree.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Re-run native source gates from umbrella path
        shell: bash
        working-directory: projects/tiny-tensor-compiler
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          pytest

      - name: Remove one-shot workflow and publish refreshed branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          git rm .github/workflows/refresh-tiny-tensor.yml
          git commit -m 'chore: remove one-shot tiny-tensor refresh workflow'
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch source main --prune
          test "$(git rev-parse source/main)" = "$SOURCE_SHA"
          git fetch origin main "$GITHUB_REF_NAME" --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git push origin HEAD:"$GITHUB_REF_NAME"
