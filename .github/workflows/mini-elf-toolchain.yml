name: mini-elf-toolchain

on:
  push:
    branches: [main]
    paths:
      - 'projects/mini-elf-toolchain/**'
      - '.github/workflows/mini-elf-toolchain.yml'
  pull_request:
    paths:
      - 'projects/mini-elf-toolchain/**'
      - '.github/workflows/mini-elf-toolchain.yml'

permissions:
  contents: read

concurrency:
  group: mini-elf-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mini-elf-toolchain
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-target/mini-elf-toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features
