name: One-shot history import — mini-debugger

on:
  push:
    branches: [chore/import-mini-debugger]
    paths:
      - '.github/workflows/import-mini-debugger.yml'

permissions:
  contents: write

concurrency:
  group: compiler-runtime-lab-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: Lei-TzuY/mini-debugger
      SOURCE_SHA: 0ed0d52d0d650e6e7b535bfe49804719cfae2c9a
      SOURCE_CI_RUN_ID: '33928883989'
      SOURCE_REMOTE: source-mini-debugger
      TARGET_PATH: projects/mini-debugger
      EXPECTED_UMBRELLA_MAIN: 75304cd25d1e2b0670e9bc9b2ea6fcecf3d607b1
    steps:
      - name: Checkout exact migration branch trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify exact trigger and umbrella prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'chore/import-mini-debugger'
          test -z "$(git status --porcelain)"
          test ! -e "$TARGET_PATH"
          test -d projects/mini-elf-toolchain
          test -d projects/mini-libc
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"

      - name: Fetch and freeze exact source history
        shell: bash
        run: |
          set -euo pipefail
          git remote add "$SOURCE_REMOTE" "https://github.com/$SOURCE_REPO.git"
          git fetch "$SOURCE_REMOTE" main --tags --prune
          LIVE_SOURCE_SHA="$(git rev-parse "$SOURCE_REMOTE/main")"
          echo "Externally verified source CI run: $SOURCE_CI_RUN_ID"
          echo "Live source: $LIVE_SOURCE_SHA"
          test "$LIVE_SOURCE_SHA" = "$SOURCE_SHA"

      - name: Audit complete reachable source history
        shell: bash
        run: |
          set -euo pipefail
          git log "$SOURCE_REMOTE/main" --format='%H%x09%an%x09%ae%x09%B' > /tmp/source-history.txt
          if grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai' /tmp/source-history.txt > /tmp/attribution-matches.txt; then
            echo 'Attribution/history matches detected; refusing automatic import.'
            cat /tmp/attribution-matches.txt
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA:README.md"
          git cat-file -e "$SOURCE_SHA:CMakeLists.txt"
          git cat-file -e "$SOURCE_SHA:docs"

      - name: Import source history without squash
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git subtree add --prefix="$TARGET_PATH" "$SOURCE_REMOTE" main
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Verify imported tree is blob-for-blob equivalent
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree -r "$SOURCE_SHA" | sort > /tmp/source-tree.txt
          git ls-tree -r HEAD -- "$TARGET_PATH" \
            | sed "s#\t$TARGET_PATH/#\t#" \
            | sort > /tmp/imported-tree.txt
          diff -u /tmp/source-tree.txt /tmp/imported-tree.txt

      - name: Run mini-debugger native CI gates from umbrella path
        shell: bash
        run: |
          set -euo pipefail
          DBG_BUILD="$RUNNER_TEMP/mini-debugger-build"
          cmake -S projects/mini-debugger -B "$DBG_BUILD" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$DBG_BUILD" --parallel 2
          ctest --test-dir "$DBG_BUILD" --output-on-failure

      - name: Verify headerless mini-ELF to mini-debugger integration
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/elf-debugger-smoke"
          DBG_BUILD="$RUNNER_TEMP/mini-debugger-build"
          ELF_TARGET="$RUNNER_TEMP/mini-elf-debugger-target"
          mkdir -p "$WORK"

          cat > "$WORK/probe.S" <<'EOF'
          .text
          .globl _start
          .type _start,@function
          _start:
              nop
              mov $60, %eax
              xor %edi, %edi
              syscall
          .size _start, .-_start
          EOF

          cc -c -nostdlib -fno-pie -o "$WORK/probe.o" "$WORK/probe.S"
          export CARGO_TARGET_DIR="$ELF_TARGET"
          cargo build --manifest-path projects/mini-elf-toolchain/Cargo.toml --bin mini-elf-toolchain
          "$ELF_TARGET/debug/mini-elf-toolchain" link -o "$WORK/probe" "$WORK/probe.o"
          chmod +x "$WORK/probe"

          HEADER="$WORK/header.txt"
          readelf -h "$WORK/probe" | tee "$HEADER"
          grep -q 'Class:.*ELF64' "$HEADER"
          grep -q 'Type:.*EXEC' "$HEADER"
          grep -Eq 'Start of section headers:[[:space:]]+0' "$HEADER"
          grep -Eq 'Number of section headers:[[:space:]]+0' "$HEADER"
          ENTRY="$(awk '/Entry point address:/ {print $4}' "$HEADER")"
          test "$ENTRY" = '0x400000'
          PROBE='0x400001'
          "$WORK/probe"

          set +e
          printf 'x %s 8\nbreak %s\ncontinue\nquit\n' "$ENTRY" "$PROBE" \
            | "$DBG_BUILD/mdbg" "$WORK/probe" > "$WORK/mdbg.out" 2>&1
          MDBG_STATUS=$?
          set -e
          cat "$WORK/mdbg.out"
          test "$MDBG_STATUS" -eq 0
          grep -q '^stopped after exec$' "$WORK/mdbg.out"
          grep -Eq '0x400000:([[:space:]]+[0-9a-f]{2})+' "$WORK/mdbg.out"
          grep -q 'Breakpoint 1 at 0x400001' "$WORK/mdbg.out"
          grep -q 'breakpoint at 0x400001' "$WORK/mdbg.out"

      - name: Clean generated umbrella artifacts and require clean tree
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain)"
          if [[ -n "$STATUS" && "$STATUS" != '?? projects/mini-elf-toolchain/Cargo.lock' ]]; then
            echo 'Unexpected files generated by migration validation:'
            git status --short
            exit 1
          fi
          rm -f projects/mini-elf-toolchain/Cargo.lock
          test -z "$(git status --porcelain)"

      - name: Remove one-shot workflow while preserving source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/import-mini-debugger.yml
          git commit -m 'chore: remove one-shot mini-debugger import workflow'
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain)"
          if git log -2 --format='%B' | grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai'; then
            echo 'Forbidden attribution trailer in umbrella import/cleanup commits.'
            exit 1
          fi

      - name: Final source, main, and branch race check; publish migration branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$SOURCE_REMOTE" main --prune
          test "$(git rev-parse "$SOURCE_REMOTE/main")" = "$SOURCE_SHA"
          git fetch origin main "$GITHUB_REF_NAME" --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_UMBRELLA_MAIN"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git push origin HEAD:"$GITHUB_REF_NAME"
