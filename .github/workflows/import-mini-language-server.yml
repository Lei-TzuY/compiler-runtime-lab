name: import-mini-language-server

on:
  push:
    branches: [chore/import-mini-language-server]
    paths:
      - ".github/workflows/import-mini-language-server.yml"

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/Lei-TzuY/mini-language-server.git
  SOURCE_SHA: f8a4d642eaa721741ab3cea7eb02d2f261dbad01
  UMBRELLA_BASE: 7213921becfa9e6bec3262b6b813bf35b7677146
  TARGET: projects/mini-language-server

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full umbrella history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: chore/import-mini-language-server

      - name: Verify frozen umbrella and source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$UMBRELLA_BASE"
          source_main="$(git ls-remote "$SOURCE_REPO" refs/heads/main | cut -f1)"
          test "$source_main" = "$SOURCE_SHA"
          umbrella_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$umbrella_main" = "$UMBRELLA_BASE"

      - name: Audit complete reachable source history
        shell: bash
        run: |
          set -euo pipefail
          git remote add source-mini-language-server "$SOURCE_REPO"
          git fetch source-mini-language-server main --tags
          test "$(git rev-parse source-mini-language-server/main)" = "$SOURCE_SHA"
          if git log "$SOURCE_SHA" --format='%H%x00%an%x00%ae%x00%B' | grep -Eai 'co-authored-by|generated-by|assisted-by|signed-off-by|anthropic|claude|openai'; then
            echo 'Configured attribution pattern found in reachable source history; refusing import.' >&2
            exit 1
          fi

      - name: Import subtree without squashing history
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$TARGET"
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git subtree add --prefix="$TARGET" source-mini-language-server main
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Verify subtree blob-for-blob
        shell: bash
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse "$SOURCE_SHA^{tree}")"
          imported_tree="$(git rev-parse "HEAD:$TARGET")"
          test "$source_tree" = "$imported_tree"

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/mini-language-server/pyproject.toml

      - name: Run source-equivalent Python gates
        working-directory: projects/mini-language-server
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest

      - name: Verify tracked tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Remove one-shot workflow and publish branch
        shell: bash
        run: |
          set -euo pipefail
          source_main="$(git ls-remote "$SOURCE_REPO" refs/heads/main | cut -f1)"
          umbrella_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$source_main" = "$SOURCE_SHA"
          test "$umbrella_main" = "$UMBRELLA_BASE"
          git rm .github/workflows/import-mini-language-server.yml
          git commit -m "chore: remove one-shot mini-language-server import workflow"
          git push origin HEAD:chore/import-mini-language-server
