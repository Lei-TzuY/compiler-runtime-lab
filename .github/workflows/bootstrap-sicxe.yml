name: Bootstrap SIC/XE import

on:
  push:
    branches:
      - main
    paths:
      - 'migration/bootstrap-sicxe.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: Lei-TzuY/sic-xe-assembler
      SOURCE_SHA: a58f4b5c7f34675fddf437d4af596cd81b5d891f
      MIGRATION_BRANCH: migration/import-sic-xe-assembler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck exact frozen source and open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trigger_sha="$(python3 -c 'import json; print(json.load(open("migration/bootstrap-sicxe.json"))["source_sha"])')"
          test "$trigger_sha" = "$SOURCE_SHA"
          live_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$SOURCE_REPO/branches/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$live_sha" = "$SOURCE_SHA"
          open_prs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$SOURCE_REPO/pulls?state=open&per_page=100" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          test "$open_prs" = 0
      - name: Import preserved source history
        shell: bash
        run: |
          set -euo pipefail
          test ! -e projects/sic-xe-assembler
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git remote add sicxe-source "https://github.com/$SOURCE_REPO.git"
          git fetch sicxe-source --tags
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git switch -c "$MIGRATION_BRANCH"
          git subtree add --prefix=projects/sic-xe-assembler sicxe-source "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          subtree_tree="$(git rev-parse HEAD:projects/sic-xe-assembler)"
          test "$source_tree" = "$subtree_tree"
          git push origin "$MIGRATION_BRANCH"
